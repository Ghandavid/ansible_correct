- name: Submit resolved JCL to z/OS
  hosts: zoslab
  gather_facts: false
  environment: "{{ environment_vars }}"
  vars:
    job_owner: IBMUSER
    hlq: GAMA10
    mlq: JCL
    llq: CNTL3
    llq2: CNTL4
    libname: JCL 
    primary_allocation: 2
    secondary_allocation: 4 
    jcl_path: "{{ playbook_dir }}/copy_jcl.j2"
    jcl_dataset_name: "{{ job_owner }}.TEMP.JCL"

  tasks:
    - name: call role to render JCL
      ansible.builtin.include_role:
        name: render_jcl_role 
        tasks_from: main.yml  

    - name: Delete temporary JCL dataset if it exists      
      ibm.ibm_zos_core.zos_data_set:
        name: "{{ jcl_dataset_name }}"
        state: absent

    - name: Allocate temporary JCL dataset
      ibm.ibm_zos_core.zos_data_set:
        name: "{{ jcl_dataset_name }}"
        state: present
        type: seq
        record_format: fb
        record_length: 80
        block_size: 3120
        space_primary: 5
        space_secondary: 1
        space_type: trk

    - name: Copy JCL into dataset (no USS)
      ibm.ibm_zos_core.zos_copy:
        src: "{{ jcl_path }}"
        dest: "{{ jcl_dataset_name }}"
        remote_src: false

    - name: Submit JCL from dataset
      ibm.ibm_zos_core.zos_job_submit:
        src: "{{ jcl_dataset_name }}"
      register: job_result


    - name: Show job id
      ansible.builtin.debug:
        var: job_result