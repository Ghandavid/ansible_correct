- name: Gather z/OS facts
  hosts: zos
  gather_facts: false
  environment: "{{ environment_vars }}"

  tasks:
  - name: Return z/OS facts.
    ibm.ibm_zos_core.zos_gather_facts:
      gather_subset: sys
    register: result

  - name: Display Host Variables
    ansible.builtin.debug:
      msg:
        - "---Print your variables data here ---"
        - "System Info: {{ result | to_nice_json }}"
