- name: Gather z/OS facts
  hosts: zos
  gather_facts: false
  environment: "{{ environment_vars }}"

  tasks:
  - name: Convert local JCL to IBM-037 and submit the job.
    zos_job_submit:
      src: "{{ playbook_dir }}/JCL/defksds.jcl"
      location: LOCAL
      encoding:
        from: ISO8859-1
        to: IBM-037
    register: job_output

  - name: Show job ID and return code
    debug:
      var: job_output